name: gh-pages

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest]
                node: [20]

        steps:
            - uses: actions/checkout@v3
            - uses: pnpm/action-setup@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install
            - run: pnpm generate
              env:
                  NUXT_APP_BASE_URL: /maison-du-marin-quebec/
            - uses: JamesIves/github-pages-deploy-action@v4.4.1
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: gh-pages
                  FOLDER: '.output/public'
                  CLEAN: true
